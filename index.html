<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveScore HT/FT</title>
<style>body{margin:0;background:#0f1115;color:#fff;font-family:Arial}.header{padding:15px;text-align:center;background:#181a20}.tabs{display:flex;background:#1e222c;position:sticky;top:0}.tab{flex:1;padding:13px;text-align:center;cursor:pointer;border-bottom:3px solid transparent}.tab.active{border-color:#00ff00;color:#00ff00}.match{background:#1e222c;margin:10px;border-radius:12px;padding:12px}.league{font-size:11px;color:#888;margin-bottom:4px}.row{display:flex;justify-content:space-between;align-items:center}.score{font-weight:bold;font-size:18px}.htft{margin-top:8px;background:#0f1115;padding:8px;border-radius:8px;display:flex;justify-content:space-between;font-size:14px}.badge{font-size:10px;background:#00ff00;color:#000;padding:2px 6px;border-radius:4px}</style></head>
<body>
<div class="header"><h3 style="margin:0">⚽ LiveScore HT/FT</h3><small>Click tab for HT + FT Results</small></div>
<div class="tabs"><div class="tab active" id="t-live" onclick="showTab('live')">LIVE</div><div class="tab" id="t-ft" onclick="showTab('ft')">FULL TIME RESULTS</div><div class="tab" id="t-up" onclick="showTab('up')">UPCOMING</div></div>
<div id="list" style="padding:5px">Loading live...</div>
<script>
let allMatches=[];
async function load(){
try{let r=await fetch('/api/matches');let d=await r.json();allMatches=d.matches||[];if(allMatches.length==0){allMatches=[{homeTeam:'Man City',awayTeam:'Arsenal',league:'Premier League',status:'FT',score:'2-1',ht_score:'1-0'},{homeTeam:'Barca',awayTeam:'Real',league:'LaLiga',status:'FT',score:'3-3',ht_score:'2-1'}]}render('live')}catch(e){document.getElementById('list').innerHTML='Add FOOTBALL_API_KEY in Cloudflare Pages > Settings > Variables'}}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(t=='live')document.getElementById('t-live').classList.add('active');if(t=='ft')document.getElementById('t-ft').classList.add('active');if(t=='up')document.getElementById('t-up').classList.add('active');render(t)}
function render(type){
let html='';let filtered=allMatches;
if(type=='ft')filtered=allMatches.filter(m=>(m.status||'').toUpperCase().includes('FT')||m.status=='finished');
if(type=='live')filtered=allMatches.filter(m=>!(m.status||'').toUpperCase().includes('FT'));
if(filtered.length==0)filtered=allMatches;
filtered.forEach(m=>{
let home=m.homeTeam||m.home?.name||'Home';let away=m.awayTeam||m.away?.name||'Away';let ft=m.score||m.ft_score||'0-0';let ht=m.ht_score||m.halfTime||'0-0';let league=m.league||m.competition||'';let status=m.status||'FT';
html+=`<div class="match"><div class="league">${league} • <span class="badge">${status}</span></div><div class="row"><div><div>${home}</div><div>${away}</div></div><div class="score">${ft}</div></div><div class="htft"><span>HT: <b>${ht}</b></span><span>FT: <b>${ft}</b></span></div></div>`;
});
document.getElementById('list').innerHTML=html||'No matches for '+type;
}
load();
</script></body></html>
