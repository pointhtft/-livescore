<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveScore - Green</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:Arial,sans-serif}
.header{background:#000;border-bottom:2px solid #00c853;padding:10px;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tab{background:#1a1a1a;color:#fff;border:1px solid #333;padding:8px 16px;border-radius:20px;white-space:nowrap;cursor:pointer;font-weight:bold}
.tab.active{background:#00c853;color:#000;border-color:#00c853}
.dates{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.date-btn{background:#1a1a1a;border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:12px;cursor:pointer;min-width:65px;text-align:center}
.date-btn.active{background:#00c853;color:#000;border-color:#00c853}
.date-btn b{display:block;font-size:14px}
.date-btn span{font-size:10px}
.container{padding:10px}
.match-card{background:#151515;border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.time{width:50px;text-align:center;font-size:13px;color:#00c853;font-weight:bold}
.teams{flex:1}
.teams b{font-size:14px}
.league{font-size:11px;color:#888;margin-top:3px}
.scores{text-align:right;min-width:70px}
.ft{font-size:18px;font-weight:bold;color:#fff}
.ht{font-size:11px;color:#888}
.refresh{background:#00c853;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="tabs">
<button class="tab" data-f="yesterday">Yesterday</button>
<button class="tab active" data-f="today">Today</button>
<button class="tab" data-f="live">Live</button>
<button class="tab" data-f="finished">Finished</button>
<button class="refresh" onclick="loadMatches(currentDate)">Refresh</button>
</div>
<div class="dates" id="dates"></div>
</div>
<div class="container" id="matches">Loading real matches from API...</div>

<script>
let currentDate = new Date().toISOString().split('T')[0];
let allMatches = [];
let currentFilter = 'today';

function buildDates(){
const c=document.getElementById('dates');c.innerHTML='';
for(let i=-3;i<=4;i++){
let d=new Date();d.setDate(d.getDate()+i);
let iso=d.toISOString().split('T')[0];
let label=i===0?'Today':i===-1?'Yest':i===1?'Tmrw':`${d.getDate()}/${d.getMonth()+1}`;
let btn=document.createElement('div');
btn.className='date-btn'+(iso===currentDate?' active':'');
btn.innerHTML=`<b>${label}</b><span>${d.getDate()}/${d.getMonth()+1}</span>`;
btn.onclick=()=>{currentDate=iso;document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadMatches(iso);};
c.appendChild(btn);
}
}

async function loadMatches(dateStr){
currentDate=dateStr||currentDate;
document.getElementById('matches').innerHTML='Loading...';
try{
let res=await fetch(`/api/matches?filter=${currentDate}`);
let data=await res.json();
allMatches=data.matches||[];
render();
}catch(e){document.getElementById('matches').innerHTML='Error: '+e.message;}
}

function render(){
let list=allMatches;
if(currentFilter==='live') list=list.filter(m=>m.status.includes('live')||m.status.includes('inplay'));
if(currentFilter==='finished') list=list.filter(m=>m.status.includes('finish')||m.status.includes('ft')||m.status.includes('ended'));
if(currentFilter==='yesterday'){ /* date already filtered */ }

const c=document.getElementById('matches');
if(!list.length){c.innerHTML='<div style="text-align:center;padding:30px;color:#666">No matches for this date</div>';return;}
c.innerHTML=list.map(m=>`
<div class="match-card">
<div class="time">${m.time||'FT'}</div>
<div class="teams"><b>${m.homeTeam} - ${m.awayTeam}</b><div class="league">${m.league}</div></div>
<div class="scores"><div class="ft">${m.ft_score}</div><div class="ht">HT: ${m.ht_score}</div></div>
</div>
`).join('');
}

document.querySelectorAll('.tab').forEach(t=>{
t.onclick=()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
t.classList.add('active');
currentFilter=t.dataset.f;
if(currentFilter==='yesterday'){let d=new Date();d.setDate(d.getDate()-1);currentDate=d.toISOString().split('T')[0];buildDates();loadMatches(currentDate);}
else if(currentFilter==='today'){let d=new Date();currentDate=d.toISOString().split('T')[0];buildDates();loadMatches(currentDate);}
else{render();}
};
});

buildDates();
loadMatches(currentDate);
</script>
</body>
</html>
